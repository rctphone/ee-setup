name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon, cgo + libusb → full USB switch
            goos: darwin
            goarch: arm64
            cgo: 1
          - os: macos-13        # Intel, cgo + libusb → full USB switch
            goos: darwin
            goarch: amd64
            cgo: 1
          - os: windows-latest  # Win32 SCSI pass-through, no cgo
            goos: windows
            goarch: amd64
            cgo: 0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb
      - name: Test
        shell: bash
        run: go test ./...
      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          name="ee-setup-$VERSION-$GOOS-$GOARCH"
          mkdir -p "dist/$name"
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/ee-setup$ext" .
          cp README.md LICENSE "dist/$name/"
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -X -qr "$name.zip" "$name")
          else
            COPYFILE_DISABLE=1 tar --no-xattrs --uid 0 --gid 0 --uname root --gname root \
              -czf "dist/$name.tar.gz" -C dist "$name"
          fi
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
